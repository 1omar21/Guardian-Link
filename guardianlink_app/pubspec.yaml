name: guardianlink_app
description: "GuardianLink - child safety app with location tracking, safety alerts and a gamified rewards dashboard"
publish_to: 'none'

version: 1.0.26+40

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Firebase (push notifications only; data goes through the backend API)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Location (GPS + background tracking via geolocator's foreground service)
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Maps: OpenStreetMap tiles via flutter_map (free, no API key)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # API & Networking
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: '>=0.18.1 <0.21.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Add assets
  assets:
    - assets/icon/

  # Add custom fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
